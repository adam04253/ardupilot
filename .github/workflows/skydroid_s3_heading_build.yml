name: SkyDroid S3 factory NOVA exact v6

on:
  workflow_dispatch:
  push:
    branches: [skydroid-s3-nova-heading]
    paths: ['.github/workflows/skydroid_s3_heading_build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.2.0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Add SkyDroid legacy GPS compatibility parameters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hp = Path('libraries/AP_GPS/AP_GPS.h')
          h = hp.read_text()
          old = '''    AP_Int16 _driver_options;\n    AP_Int8 _primary;\n'''
          new = '''    AP_Int16 _driver_options;\n    // Legacy SkyDroid S3 GPS parameters recovered from factory firmware.\n    AP_Int16 _fix_angle;\n    AP_Int8  _ac_gps;\n    AP_Int32 _ac_bd;\n    AP_Int8  _mk43_en;\n    AP_Int8  _m100_en;\n    AP_Int8 _primary;\n'''
          if old not in h:
              raise SystemExit('AP_GPS.h parameter marker not found')
          h = h.replace(old, new, 1)
          hp.write_text(h)

          cp = Path('libraries/AP_GPS/AP_GPS.cpp')
          c = cp.read_text()
          marker = '''    // @Group: 1_\n    // @Path: AP_GPS_Params.cpp\n'''
          params = '''    // SkyDroid factory compatibility parameters.  These names and types\n    // are present in the original S3 firmware GPS AP_Param table.\n    AP_GROUPINFO("_FIX_ANGLE", 34, AP_GPS, _fix_angle, 90),\n    AP_GROUPINFO("_AC_GPS",    35, AP_GPS, _ac_gps, 0),\n    AP_GROUPINFO("_AC_BD",     36, AP_GPS, _ac_bd, 115200),\n    // Factory GroupInfo default is 0, but the SkyDroid S3 board default\n    // overrides GPS_MK43_EN to 1. Match the effective S3 default here.\n    AP_GROUPINFO("_MK43_EN",   37, AP_GPS, _mk43_en, 1),\n    AP_GROUPINFO("_M100_EN",   38, AP_GPS, _m100_en, 1),\n\n'''
          if marker not in c:
              raise SystemExit('AP_GPS.cpp var_info marker not found')
          c = c.replace(marker, params + marker, 1)
          cp.write_text(c)
          PY

      - name: Patch NOVA to exact SkyDroid S3 factory heading behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hp = Path('libraries/AP_GPS/AP_GPS_NOVA.h')
          h = hp.read_text()
          marker = '    static const uint8_t NOVA_BESTVEL = 99;\n'
          heading = '''    // SkyDroid S3 NOVA HEADINGB, recovered from factory firmware.\n    static const uint16_t NOVA_HEADING = 971;\n    struct PACKED heading\n    {\n        uint32_t solstat;\n        uint32_t postype;\n        float length;\n        float heading_deg;\n        float pitch_deg;\n        float reserved;\n        float heading_stddev_deg;\n        float pitch_stddev_deg;\n        uint8_t tail[12];\n    };\n\n'''
          if marker not in h:
              raise SystemExit('NOVA header marker not found')
          h = h.replace(marker, heading + marker, 1)
          h = h.replace('        psrdop psrdopu;\n        uint8_t bytes[256];',
                        '        psrdop psrdopu;\n        heading headingu;\n        uint8_t bytes[256];', 1)
          hp.write_text(h)

          cp = Path('libraries/AP_GPS/AP_GPS_NOVA.cpp')
          c = cp.read_text()

          # Replace upstream NOVA startup with the byte-for-byte command sequence
          # sent by the factory SkyDroid S3 NOVA constructor.  The factory image
          # sends these commands unconditionally after driver construction.
          ctor = '''    if (gps._auto_config != AP_GPS::GPS_AUTO_CONFIG_DISABLE) {\n        const char *init_str = _initialisation_blob[0];\n        const char *init_str1 = _initialisation_blob[1];\n\n        port->write((const uint8_t*)init_str, strlen(init_str));\n        port->write((const uint8_t*)init_str1, strlen(init_str1));\n    }\n'''
          ctor_new = '''    static const char skydroid_factory_nova_setup[] =\n        "\\r\\n\\r\\nunlogall\\r\\n"\n        "mode rover\\r\\n"\n        "config com1 115200\\r\\n"\n        "log bestposb ontime 0.2 0 nohold\\r\\n"\n        "log bestvelb ontime 0.2 0 nohold\\r\\n"\n        "log headingb ontime 0.2 0 nohold\\r\\n"\n        "log psrdopb onchanged\\r\\n"\n        "log psrdopb ontime 0.2\\r\\n"\n        "log psrdopb\\r\\n"\n        "log psrposb ontime 0.2\\r\\n"\n        "log psrposb\\r\\n"\n        "saveconfig\\r\\n";\n    port->write((const uint8_t*)skydroid_factory_nova_setup,\n                strlen(skydroid_factory_nova_setup));\n\n    // Prevent the upstream NOVA init blob from being sent later by read();\n    // the factory sequence above fully replaces it.\n    _init_blob_index = ARRAY_SIZE(_initialisation_blob);\n'''
          if ctor not in c:
              raise SystemExit('NOVA constructor marker not found')
          c = c.replace(ctor, ctor_new, 1)

          marker2 = '    case NOVA_PSRDOP: {  // psrdop\n'
          heading_case = '''    case NOVA_HEADING: {\n        // The factory S3 parser handles message 971 as HEADINGB.\n        if (nova_msg.header.nova_headeru.messagelength < 28) {\n            return false;\n        }\n\n        const heading &h = nova_msg.data.headingu;\n\n        // Exact factory gating recovered from Thumb-2 code:\n        //   current GPS fix must be better than 2D;\n        //   satellites used must be > 14;\n        //   HEADINGB heading standard deviation must be > 0 and <= 3 deg.\n        // The factory code does NOT gate yaw on HEADINGB solstat, baseline\n        // length or pitch.\n        if (state.status <= AP_GPS_FixType::FIX_2D) {\n            return false;\n        }\n\n        const bool valid = state.num_sats > 14 &&\n                           isfinite(h.heading_stddev_deg) &&\n                           h.heading_stddev_deg > 0.0f &&\n                           h.heading_stddev_deg <= 3.0f;\n        if (!valid) {\n            state.have_gps_yaw = false;\n            state.have_gps_yaw_accuracy = false;\n            return false;\n        }\n\n        // Exact factory yaw transformation:\n        // GPS yaw = HEADINGB heading - GPS_FIX_ANGLE, then wrap 0..360.\n        const float yaw_deg = wrap_360(h.heading_deg - float(gps._fix_angle.get()));\n        state.gps_yaw = yaw_deg;\n        state.gps_yaw_time_ms = state.last_gps_time_ms;\n        state.gps_yaw_accuracy = h.heading_stddev_deg;\n        state.have_gps_yaw_accuracy = true;\n        state.have_gps_yaw = true;\n        state.gps_yaw_configured = true;\n        return false;\n    }\n'''
          if marker2 not in c:
              raise SystemExit('NOVA process marker not found')
          c = c.replace(marker2, heading_case + marker2, 1)
          cp.write_text(c)
          PY

          grep -n "FIX_ANGLE\|AC_GPS\|AC_BD\|MK43_EN\|M100_EN\|NOVA_HEADING\|headingb\|skydroid_factory_nova_setup\|gps_yaw" \
            libraries/AP_GPS/AP_GPS.{h,cpp} libraries/AP_GPS/AP_GPS_NOVA.{h,cpp}

      - name: Build Rover for SkyDroid-S3
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH="/opt/gcc-arm-none-eabi-10/bin:$PATH"
          ./waf configure --board SkyDroid-S3
          ./waf rover

      - name: Collect firmware
        shell: bash
        run: |
          mkdir -p firmware
          cp build/SkyDroid-S3/bin/ardurover.apj firmware/ || true
          cp build/SkyDroid-S3/bin/ardurover.bin firmware/ || true
          cp build/SkyDroid-S3/bin/ardurover_with_bl.hex firmware/ || true
          ls -lah firmware

      - uses: actions/upload-artifact@v4
        with:
          name: skydroid-s3-rover-factory-nova-exact-v6
          path: firmware/
          if-no-files-found: error
