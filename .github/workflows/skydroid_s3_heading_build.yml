name: SkyDroid S3 Unicore dual heading v8

on:
  workflow_dispatch:
  push:
    branches: [skydroid-s3-nova-heading]
    paths: ['.github/workflows/skydroid_s3_heading_build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.2.0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Add SkyDroid legacy GPS compatibility parameters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hp = Path('libraries/AP_GPS/AP_GPS.h')
          h = hp.read_text()
          old = '''    AP_Int16 _driver_options;\n    AP_Int8 _primary;\n'''
          new = '''    AP_Int16 _driver_options;\n    // Legacy SkyDroid S3 GPS parameters present in factory firmware.\n    AP_Int16 _fix_angle;\n    AP_Int8  _ac_gps;\n    AP_Int32 _ac_bd;\n    AP_Int8  _mk43_en;\n    AP_Int8  _m100_en;\n    AP_Int8 _primary;\n'''
          if old not in h:
              raise SystemExit('AP_GPS.h parameter marker not found')
          hp.write_text(h.replace(old, new, 1))

          cp = Path('libraries/AP_GPS/AP_GPS.cpp')
          c = cp.read_text()
          marker = '''    // @Group: 1_\n    // @Path: AP_GPS_Params.cpp\n'''
          params = '''    // SkyDroid factory compatibility names.\n    AP_GROUPINFO("_FIX_ANGLE", 34, AP_GPS, _fix_angle, 90),\n    AP_GROUPINFO("_AC_GPS",    35, AP_GPS, _ac_gps, 0),\n    AP_GROUPINFO("_AC_BD",     36, AP_GPS, _ac_bd, 115200),\n    AP_GROUPINFO("_MK43_EN",   37, AP_GPS, _mk43_en, 1),\n    AP_GROUPINFO("_M100_EN",   38, AP_GPS, _m100_en, 1),\n\n'''
          if marker not in c:
              raise SystemExit('AP_GPS.cpp group marker not found')
          cp.write_text(c.replace(marker, params + marker, 1))
          PY

      - name: Patch NOVA for Unicore dual-antenna heading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hp = Path('libraries/AP_GPS/AP_GPS_NOVA.h')
          h = hp.read_text()
          h = h.replace('static const char* const _initialisation_blob[4];',
                        'static const char* const _initialisation_blob[5];')

          marker = '    static const uint8_t NOVA_BESTVEL = 99;\n'
          heading = '''    // SkyDroid S3 HEADINGB message 971.\n    static const uint16_t NOVA_HEADING = 971;\n    struct PACKED heading\n    {\n        uint32_t solstat;\n        uint32_t postype;\n        float length;\n        float heading_deg;\n        float pitch_deg;\n        float reserved;\n        float heading_stddev_deg;\n        float pitch_stddev_deg;\n        uint8_t tail[12];\n    };\n\n'''
          if marker not in h:
              raise SystemExit('NOVA header marker not found')
          h = h.replace(marker, heading + marker, 1)
          h = h.replace('        psrdop psrdopu;\n        uint8_t bytes[256];',
                        '        psrdop psrdopu;\n        heading headingu;\n        uint8_t bytes[256];', 1)
          hp.write_text(h)

          cp = Path('libraries/AP_GPS/AP_GPS_NOVA.cpp')
          c = cp.read_text()
          c = c.replace('const char* const AP_GPS_NOVA::_initialisation_blob[4] {',
                        'const char* const AP_GPS_NOVA::_initialisation_blob[5] {')
          c = c.replace('    "log bestvelb ontime 0.2 0 nohold\\r\\n",\n    "log psrdopb ontime 0.2 0 nohold\\r\\n",',
                        '    "log bestvelb ontime 0.2 0 nohold\\r\\n",\n    "log headingb ontime 0.2 0 nohold\\r\\n",\n    "log psrdopb ontime 0.2 0 nohold\\r\\n",', 1)

          ctor = '''    if (gps._auto_config != AP_GPS::GPS_AUTO_CONFIG_DISABLE) {\n        const char *init_str = _initialisation_blob[0];\n        const char *init_str1 = _initialisation_blob[1];\n\n        port->write((const uint8_t*)init_str, strlen(init_str));\n        port->write((const uint8_t*)init_str1, strlen(init_str1));\n    }\n'''
          ctor_new = '''    if (gps._auto_config != AP_GPS::GPS_AUTO_CONFIG_DISABLE) {\n        const char *init_str = _initialisation_blob[0];\n        const char *init_str1 = _initialisation_blob[1];\n\n        port->write((const uint8_t*)init_str, strlen(init_str));\n        port->write((const uint8_t*)init_str1, strlen(init_str1));\n    } else {\n        // Enable Unicore dual-antenna heading for this boot only.\n        // No SAVECONFIG: the test is reversible.\n        static const char dual_heading_setup[] =\n            "GPTHS 1\\r\\n"\n            "log headingb ontime 0.2 0 nohold\\r\\n";\n        port->write((const uint8_t*)dual_heading_setup, strlen(dual_heading_setup));\n    }\n'''
          if ctor not in c:
              raise SystemExit('NOVA constructor marker not found')
          c = c.replace(ctor, ctor_new, 1)

          marker2 = '    case NOVA_PSRDOP: {  // psrdop\n'
          heading_case = '''    case NOVA_HEADING: {\n        if (nova_msg.header.nova_headeru.messagelength < 28) {\n            state.have_gps_yaw = false;\n            return false;\n        }\n\n        const heading &h = nova_msg.data.headingu;\n        state.gps_yaw_configured = true;\n\n        const bool valid = state.status > AP_GPS_FixType::FIX_2D &&\n                           state.num_sats > 14 &&\n                           isfinite(h.heading_deg) &&\n                           isfinite(h.heading_stddev_deg) &&\n                           h.heading_stddev_deg > 0.0f &&\n                           h.heading_stddev_deg <= 3.0f;\n        if (!valid) {\n            state.have_gps_yaw = false;\n            state.have_gps_yaw_accuracy = false;\n            return false;\n        }\n\n        const float yaw_deg = wrap_360(h.heading_deg - float(gps._fix_angle.get()));\n        const uint32_t now = AP_HAL::millis();\n        state.gps_yaw = yaw_deg;\n        state.gps_yaw_time_ms = now;\n        state.have_gps_yaw = true;\n        state.gps_yaw_accuracy = h.heading_stddev_deg;\n        state.have_gps_yaw_accuracy = true;\n\n        if (isfinite(h.length)) {\n            state.relPosLength = h.length;\n        }\n        state.relPosHeading = yaw_deg;\n        if (isfinite(h.length) && isfinite(h.pitch_deg)) {\n            state.relPosD = h.length * sinf(radians(-h.pitch_deg));\n        }\n        state.accHeading = h.heading_stddev_deg;\n        state.relposheading_ts = now;\n        return false;\n    }\n'''
          if marker2 not in c:
              raise SystemExit('NOVA message marker not found')
          cp.write_text(c.replace(marker2, heading_case + marker2, 1))
          PY

          grep -n "FIX_ANGLE\|MK43_EN\|M100_EN\|GPTHS\|NOVA_HEADING\|headingb\|gps_yaw" \
            libraries/AP_GPS/AP_GPS.{h,cpp} libraries/AP_GPS/AP_GPS_NOVA.{h,cpp}

      - name: Build Rover for SkyDroid-S3
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH="/opt/gcc-arm-none-eabi-10/bin:$PATH"
          ./waf configure --board SkyDroid-S3
          ./waf rover

      - name: Collect firmware
        shell: bash
        run: |
          mkdir -p firmware
          cp build/SkyDroid-S3/bin/ardurover.apj firmware/ || true
          cp build/SkyDroid-S3/bin/ardurover.bin firmware/ || true
          cp build/SkyDroid-S3/bin/ardurover_with_bl.hex firmware/ || true
          ls -lah firmware

      - uses: actions/upload-artifact@v4
        with:
          name: skydroid-s3-rover-unicore-dual-heading-v8
          path: firmware/
          if-no-files-found: error
