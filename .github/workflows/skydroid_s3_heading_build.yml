name: SkyDroid S3 NOVA minimal heading v7

on:
  workflow_dispatch:
  push:
    branches: [skydroid-s3-nova-heading]
    paths: ['.github/workflows/skydroid_s3_heading_build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.2.0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Patch NOVA with minimal SkyDroid S3 HEADINGB passthrough
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hp = Path('libraries/AP_GPS/AP_GPS_NOVA.h')
          h = hp.read_text()
          h = h.replace('static const char* const _initialisation_blob[4];',
                        'static const char* const _initialisation_blob[5];')

          marker = '    static const uint8_t NOVA_BESTVEL = 99;\n'
          heading = '''    // SkyDroid S3 NOVA HEADINGB message 971.\n    // Do not configure receiver mode here; only parse the message.\n    static const uint16_t NOVA_HEADING = 971;\n    struct PACKED heading\n    {\n        uint32_t solstat;\n        uint32_t postype;\n        float length;\n        float heading_deg;\n        float pitch_deg;\n        float reserved;\n        float heading_stddev_deg;\n        float pitch_stddev_deg;\n    };\n\n'''
          if marker not in h:
              raise SystemExit('NOVA header marker not found')
          h = h.replace(marker, heading + marker, 1)
          h = h.replace('        psrdop psrdopu;\n        uint8_t bytes[256];',
                        '        psrdop psrdopu;\n        heading headingu;\n        uint8_t bytes[256];', 1)
          hp.write_text(h)

          cp = Path('libraries/AP_GPS/AP_GPS_NOVA.cpp')
          c = cp.read_text()

          # Add HEADINGB to the normal NOVA init list for completeness.
          # With GPS_AUTO_CONFIG=0 this list is NOT sent; see constructor below.
          c = c.replace('const char* const AP_GPS_NOVA::_initialisation_blob[4] {',
                        'const char* const AP_GPS_NOVA::_initialisation_blob[5] {')
          c = c.replace('    "log bestvelb ontime 0.2 0 nohold\\r\\n",\n    "log psrdopb ontime 0.2 0 nohold\\r\\n",',
                        '    "log bestvelb ontime 0.2 0 nohold\\r\\n",\n    "log headingb ontime 0.2 0 nohold\\r\\n",\n    "log psrdopb ontime 0.2 0 nohold\\r\\n",', 1)

          # Critical behaviour for S3: when GPS_AUTO_CONFIG=0, do not send
          # unlogall/mode/config/saveconfig. Request HEADINGB only and leave the
          # receiver's existing dual-antenna configuration untouched.
          ctor = '''    if (gps._auto_config != AP_GPS::GPS_AUTO_CONFIG_DISABLE) {\n        const char *init_str = _initialisation_blob[0];\n        const char *init_str1 = _initialisation_blob[1];\n\n        port->write((const uint8_t*)init_str, strlen(init_str));\n        port->write((const uint8_t*)init_str1, strlen(init_str1));\n    }\n'''
          ctor_new = '''    if (gps._auto_config != AP_GPS::GPS_AUTO_CONFIG_DISABLE) {\n        const char *init_str = _initialisation_blob[0];\n        const char *init_str1 = _initialisation_blob[1];\n\n        port->write((const uint8_t*)init_str, strlen(init_str));\n        port->write((const uint8_t*)init_str1, strlen(init_str1));\n    } else {\n        static const char heading_log[] = "log headingb ontime 0.2 0 nohold\\r\\n";\n        port->write((const uint8_t*)heading_log, strlen(heading_log));\n    }\n'''
          if ctor not in c:
              raise SystemExit('NOVA constructor marker not found')
          c = c.replace(ctor, ctor_new, 1)

          marker2 = '    case NOVA_PSRDOP: {  // psrdop\n'
          heading_case = '''    case NOVA_HEADING: {\n        if (nova_msg.header.nova_headeru.messagelength < sizeof(heading)) {\n            state.have_gps_yaw = false;\n            return false;\n        }\n\n        const heading &h = nova_msg.data.headingu;\n        const uint32_t now = AP_HAL::millis();\n        state.gps_yaw_configured = true;\n\n        // Minimal pass-through: use the HEADINGB heading field directly.\n        // No FIX_ANGLE, no baseline/pitch filtering, no receiver reconfiguration.\n        if (h.solstat == 0 && isfinite(h.heading_deg) &&\n            h.heading_deg >= 0.0f && h.heading_deg < 360.0f) {\n            state.gps_yaw = wrap_360(h.heading_deg);\n            state.gps_yaw_time_ms = now;\n            state.have_gps_yaw = true;\n\n            if (isfinite(h.heading_stddev_deg) && h.heading_stddev_deg >= 0.0f) {\n                state.gps_yaw_accuracy = h.heading_stddev_deg;\n                state.have_gps_yaw_accuracy = true;\n            } else {\n                state.have_gps_yaw_accuracy = false;\n            }\n\n            if (isfinite(h.length)) {\n                state.relPosLength = h.length;\n            }\n            state.relPosHeading = state.gps_yaw;\n            if (isfinite(h.length) && isfinite(h.pitch_deg)) {\n                state.relPosD = h.length * sinf(radians(-h.pitch_deg));\n            }\n            state.accHeading = state.have_gps_yaw_accuracy ? h.heading_stddev_deg : 0.0f;\n            state.relposheading_ts = now;\n        } else {\n            state.have_gps_yaw = false;\n            state.have_gps_yaw_accuracy = false;\n        }\n        return false;\n    }\n'''
          if marker2 not in c:
              raise SystemExit('NOVA process marker not found')
          c = c.replace(marker2, heading_case + marker2, 1)
          cp.write_text(c)
          PY

          grep -n "NOVA_HEADING\|headingb\|gps_yaw\|relPosHeading" \
            libraries/AP_GPS/AP_GPS_NOVA.{h,cpp}

      - name: Build Rover for SkyDroid-S3
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH="/opt/gcc-arm-none-eabi-10/bin:$PATH"
          ./waf configure --board SkyDroid-S3
          ./waf rover

      - name: Collect firmware
        shell: bash
        run: |
          mkdir -p firmware
          cp build/SkyDroid-S3/bin/ardurover.apj firmware/ || true
          cp build/SkyDroid-S3/bin/ardurover.bin firmware/ || true
          cp build/SkyDroid-S3/bin/ardurover_with_bl.hex firmware/ || true
          ls -lah firmware

      - uses: actions/upload-artifact@v4
        with:
          name: skydroid-s3-rover-nova-minimal-heading-v7
          path: firmware/
          if-no-files-found: error
