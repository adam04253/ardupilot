name: SkyDroid S3 NOVA heading diagnostic v3

on:
  workflow_dispatch:
  push:
    branches: [skydroid-s3-nova-heading]
    paths: ['.github/workflows/skydroid_s3_heading_build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.2.0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Patch AP_GPS_NOVA with HEADINGB diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hp = Path('libraries/AP_GPS/AP_GPS_NOVA.h')
          h = hp.read_text()
          h = h.replace('static const char* const _initialisation_blob[4];',
                        'static const char* const _initialisation_blob[5];')
          marker = '    static const uint8_t NOVA_BESTVEL = 99;\n'
          heading = '''    // SkyDroid S3 dual-antenna HEADINGB diagnostic support\n    static const uint16_t NOVA_HEADING = 971;\n    struct PACKED heading\n    {\n        uint32_t solstat;\n        uint32_t postype;\n        float f08;\n        float f12;\n        float f16;\n        float f20;\n        float f24;\n        float f28;\n        uint8_t tail[12];\n    };\n\n'''
          if marker not in h:
              raise SystemExit('header marker not found')
          h = h.replace(marker, heading + marker, 1)
          h = h.replace('        psrdop psrdopu;\n        uint8_t bytes[256];',
                        '        psrdop psrdopu;\n        heading headingu;\n        uint8_t bytes[256];')
          hp.write_text(h)

          cp = Path('libraries/AP_GPS/AP_GPS_NOVA.cpp')
          c = cp.read_text()
          c = c.replace('#include <AP_Logger/AP_Logger.h>',
                        '#include <AP_Logger/AP_Logger.h>\n#include <GCS_MAVLink/GCS.h>')
          c = c.replace('const char* const AP_GPS_NOVA::_initialisation_blob[4] {',
                        'const char* const AP_GPS_NOVA::_initialisation_blob[5] {')
          c = c.replace('    "log bestvelb ontime 0.2 0 nohold\\r\\n",\n    "log psrdopb ontime 0.2 0 nohold\\r\\n",',
                        '    "log bestvelb ontime 0.2 0 nohold\\r\\n",\n    "log headingb ontime 0.2 0 nohold\\r\\n",\n    "log psrdopb ontime 0.2 0 nohold\\r\\n",')

          ctor = '''    if (gps._auto_config != AP_GPS::GPS_AUTO_CONFIG_DISABLE) {\n        const char *init_str = _initialisation_blob[0];\n        const char *init_str1 = _initialisation_blob[1];\n\n        port->write((const uint8_t*)init_str, strlen(init_str));\n        port->write((const uint8_t*)init_str1, strlen(init_str1));\n    }\n'''
          ctor_new = '''    if (gps._auto_config != AP_GPS::GPS_AUTO_CONFIG_DISABLE) {\n        const char *init_str = _initialisation_blob[0];\n        const char *init_str1 = _initialisation_blob[1];\n\n        port->write((const uint8_t*)init_str, strlen(init_str));\n        port->write((const uint8_t*)init_str1, strlen(init_str1));\n    } else {\n        static const char heading_log[] = "log headingb ontime 0.2 0 nohold\\r\\n";\n        port->write((const uint8_t*)heading_log, strlen(heading_log));\n    }\n'''
          if ctor not in c:
              raise SystemExit('constructor marker not found')
          c = c.replace(ctor, ctor_new, 1)

          marker2 = '    case NOVA_PSRDOP: {  // psrdop\n'
          heading_case = '''    case NOVA_HEADING: {\n        if (nova_msg.header.nova_headeru.messagelength < 32) {\n            state.have_gps_yaw = false;\n            return false;\n        }\n        const heading &h = nova_msg.data.headingu;\n        const uint32_t now = AP_HAL::millis();\n\n        // Keep the previous candidate in GPS_RAW_INT yaw for continuity.\n        state.gps_yaw_configured = true;\n        if (h.solstat == 0 && isfinite(h.f12) && h.f12 >= 0.0f && h.f12 < 360.0f) {\n            state.gps_yaw = wrap_360(h.f12);\n            state.gps_yaw_time_ms = now;\n            state.have_gps_yaw = true;\n        } else {\n            state.have_gps_yaw = false;\n        }\n\n        // Once per second print the raw float candidates from payload offsets\n        // 8,12,16,20,24,28 so we can identify the real heading field.\n        static uint32_t last_diag_ms;\n        if (now - last_diag_ms >= 1000) {\n            last_diag_ms = now;\n            GCS *g = GCS::get_singleton();\n            if (g != nullptr) {\n                g->send_text(MAV_SEVERITY_INFO,\n                             "HB 8=%.2f 12=%.2f 16=%.2f",\n                             (double)h.f08, (double)h.f12, (double)h.f16);\n                g->send_text(MAV_SEVERITY_INFO,\n                             "HB 20=%.2f 24=%.2f 28=%.2f",\n                             (double)h.f20, (double)h.f24, (double)h.f28);\n            }\n        }\n        return false;\n    }\n'''
          if marker2 not in c:
              raise SystemExit('process marker not found')
          c = c.replace(marker2, heading_case + marker2, 1)
          cp.write_text(c)
          PY

          grep -n "NOVA_HEADING\|headingb\|HB 8=" libraries/AP_GPS/AP_GPS_NOVA.{h,cpp}

      - name: Build Rover for SkyDroid-S3
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH="/opt/gcc-arm-none-eabi-10/bin:$PATH"
          ./waf configure --board SkyDroid-S3
          ./waf rover

      - name: Collect firmware
        shell: bash
        run: |
          mkdir -p firmware
          cp build/SkyDroid-S3/bin/ardurover.apj firmware/ || true
          cp build/SkyDroid-S3/bin/ardurover.bin firmware/ || true
          cp build/SkyDroid-S3/bin/ardurover_with_bl.hex firmware/ || true
          ls -lah firmware

      - uses: actions/upload-artifact@v4
        with:
          name: skydroid-s3-rover-nova-heading-v3-diagnostic
          path: firmware/
          if-no-files-found: error
